name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify committed packs are present
        run: |
          for p in vampiremelee vampireranged vampiremerits vampiredemerits vampiredisciplines vampirerites npcactors npcjournals; do
            test -d "packs/$p" || { echo "Missing pack: $p"; exit 1; }
          done

      - name: Zip module
        run: zip -r biblioteka.zip module.json packs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: biblioteka.zip
